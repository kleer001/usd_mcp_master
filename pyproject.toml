[project]
name = "usd-mcp"
version = "0.1.0"
description = "Read-only MCP server that explains OpenUSD composition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["usd", "openusd", "mcp", "vfx", "composition", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "mcp>=2.0.0",
    "usd-core",
]

[project.urls]
Homepage = "https://github.com/kleer001/usd_mcp_master"
Repository = "https://github.com/kleer001/usd_mcp_master"
Issues = "https://github.com/kleer001/usd_mcp_master/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
usd-mcp = "usd_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usd_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
