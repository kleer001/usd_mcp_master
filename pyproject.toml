[project]
name = "usd-mcp"
version = "0.1.0"
description = "Read-only MCP server that explains OpenUSD composition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "usd-core",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
usd-mcp = "usd_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usd_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
